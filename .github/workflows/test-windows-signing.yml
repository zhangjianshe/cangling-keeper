name: Test Windows signing
on:
  workflow_dispatch:
    inputs:
      release:
        description: Existing release to use as a signing test input (published assets are not replaced)
        required: true
        default: v0.0.97
        type: string
permissions:
  contents: read
jobs:
  sign-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing Windows build for signing test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE: ${{ inputs.release }}
        run: |
          if ($env:SOURCE_RELEASE -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a version tag.' }
          gh release download $env:SOURCE_RELEASE --repo $env:GITHUB_REPOSITORY --pattern 'cangling-keeper-windows-x86_64.exe' --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the test input.' }
      - name: Sign and verify Windows EXE
        timeout-minutes: 5
        shell: pwsh
        env:
          KEEPER_WINDOWS_SIGNING_PFX: ${{ secrets.KEEPER_WINDOWS_SIGNING_PFX }}
          KEEPER_WINDOWS_SIGNING_PASSWORD: ${{ secrets.KEEPER_WINDOWS_SIGNING_PASSWORD }}
        run: ./scripts/sign-windows.ps1
      - name: Save signed test EXE and public certificates
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-test
          retention-days: 7
          path: |
            dist/cangling-keeper-windows-x86_64.exe
            docs/certificates/*.cer
