name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
            arch-name: amd64
          - platform: windows-latest
            os-name: windows
            arch-name: x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            patchelf

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ github.ref_name }}
          releaseName: 'cangling-keeper ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false

      - name: Find and upload every bundle file separately
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          echo "Searching for build artifacts..."
          
          mapfile -d '' FILES < <(find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
             -o -name '*.AppImage.tar.gz' -o -name '*.exe' -o -name '*.msi' \) -print0)
          
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "::error::No bundle files found to upload"
            exit 1
          fi
          
          echo "Found ${#FILES[@]} bundle file(s):"
          for f in "${FILES[@]}"; do echo "  - $f"; done
          
          for f in "${FILES[@]}"; do
            name="$(basename "$f")"
            echo "::group::Uploading $name"
            curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
              -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
              -F "token=63cef07f4ee54823b25c652b0268f71d" \
              -F "version=latest" \
              -F "name=$name" \
              -F "summary=Automatic release for version $TAG" \
              -F "os=${{ matrix.os-name }}" \
              -F "arch=${{ matrix.arch-name }}" \
              -F "file=@$f"
            echo "::endgroup::"
          done
          
          echo "${{ github.ref_name }}" > version.txt
          
          # Upload version file
          curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
            -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
            -F "token=63cef07f4ee54823b25c652b0268f71d" \
            -F "version=latest" \
            -F "name=version.txt" \
            -F "summary=Automatic release for version $TAG" \
            -F "os=${{ matrix.os-name }}" \
            -F "arch=${{ matrix.arch-name }}" \
            -F "file=@version.txt"