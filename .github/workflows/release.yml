name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
            arch-name: amd64
          - platform: windows-latest
            os-name: windows
            arch-name: x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            patchelf

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ github.ref_name }}
          releaseName: 'cangling-keeper ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false

      - name: Upload bundles to software center
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          # Stage each bundle under a stable filename the app can request
          # (e.g. cangling-keeper-setup.exe, cangling-keeper.AppImage).
          STAGE="$(mktemp -d)"
          mapfile -d '' FILES < <(find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
             -o -name '*.exe' -o -name '*.msi' \) -print0)

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "::error::No bundle files found to upload"
            exit 1
          fi

          for f in "${FILES[@]}"; do
            case "$f" in
              *.deb) stable="cangling-keeper.deb" ;;
              *.rpm) stable="cangling-keeper.rpm" ;;
              *.AppImage) stable="cangling-keeper.AppImage" ;;
              *.exe) stable="cangling-keeper-setup.exe" ;;
              *.msi) stable="cangling-keeper.msi" ;;
              *) continue ;;
            esac
            cp "$f" "$STAGE/$stable"
            echo "::group::Uploading $stable ($f)"
            RESP="$(curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
              -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
              -F "token=63cef07f4ee54823b25c652b0268f71d" \
              -F "version=latest" \
              -F "name=$stable" \
              -F "summary=Automatic release for version $TAG" \
              -F "os=${{ matrix.os-name }}" \
              -F "arch=${{ matrix.arch-name }}" \
              -F "file=@$STAGE/$stable")"
            echo "$RESP"
            # The server answers HTTP 200 even for failures, so check the body.
            if ! grep -q '"success":true' <<<"$RESP"; then
              echo "::error::Upload failed for $stable: $RESP"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Upload version file
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.ref_name }}" > version.txt
          # `name` must end with `-version` so the server stores the file as
          # version.txt (otherwise it gets renamed to v.txt).
          RESP="$(curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
            -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
            -F "token=63cef07f4ee54823b25c652b0268f71d" \
            -F "version=latest" \
            -F "name=cangling-keeper-version" \
            -F "summary=${{ github.ref_name }}" \
            -F "os=app" \
            -F "arch=all" \
            -F "file=@version.txt")"
          echo "$RESP"
          if ! grep -q '"success":true' <<<"$RESP"; then
            echo "::error::Upload failed for version.txt: $RESP"
            exit 1
          fi
