name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
            arch-name: amd64
            file-pattern: "target/release/bundle/nsis/*.exe" # Or appropriate bundle path
          - platform: windows-latest
            os-name: windows
            arch-name: x86_64
            file-pattern: "target/release/bundle/msi/*.msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            patchelf

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ github.ref_name }}
          releaseName: 'cangling-keeper ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelase: false

      - name: Find and upload package to software center
        shell: bash
        run: |
          # Automatically find the built installer/binary file in target/release/bundle
          # Adjust the folder structure (e.g., nsis, msi, deb, appimage) based on your tauri.conf.json bundle targets
          echo "Searching for build artifacts..."
          find target/release -maxdepth 4
          
          # Example: Grab the first matching artifact (e.g. .msi, .exe, .deb, .AppImage)
          # You can refine this glob pattern to match the exact file you want to push
          UPLOAD_FILE=$(find target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) | head -n 1)
          
          if [ -z "$UPLOAD_FILE" ] || [ ! -f "$UPLOAD_FILE" ]; then
            echo "Error: Could not find build artifact to upload!"
            exit 1
          fi
          
          echo "Found file to upload: $UPLOAD_FILE"

          curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
            -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
            -F "token=63cef07f4ee54823b25c652b0268f71d" \
            -F "version=latest" \
            -F "name=cangling-keeper" \
            -F "summary=Automatic release for version ${{ github.ref_name }}" \
            -F "os=${{ matrix.os-name }}" \
            -F "arch=${{ matrix.arch-name }}" \
            -F "file=@$UPLOAD_FILE"