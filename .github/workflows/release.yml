name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
            arch-name: amd64
          - platform: windows-latest
            os-name: windows
            arch-name: x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os-name }}" == "windows" ]]; then
            cp target/release/cangling-keeper.exe dist/cangling-keeper-windows-x86_64.exe
          else
            cp target/release/cangling-keeper dist/cangling-keeper-linux-amd64
            chmod +x dist/cangling-keeper-linux-amd64
          fi

      - name: Upload GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*

      - name: Upload bundles to software center
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          mapfile -d '' FILES < <(find dist -type f -print0)

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "::error::No release binary found to upload"
            exit 1
          fi

          for f in "${FILES[@]}"; do
            if [[ "${{ matrix.os-name }}" == "windows" ]]; then
              stable="cangling-keeper-windows-x86_64.exe"
            else
              stable="cangling-keeper-linux-amd64"
            fi
            echo "::group::Uploading $stable ($f)"
            RESP="$(curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
              -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
              -F "token=63cef07f4ee54823b25c652b0268f71d" \
              -F "version=latest" \
              -F "name=$stable" \
              -F "summary=Automatic release for version $TAG" \
              -F "os=${{ matrix.os-name }}" \
              -F "arch=${{ matrix.arch-name }}" \
              -F "file=@$f")"
            echo "$RESP"
            # The server answers HTTP 200 even for failures, so check the body.
            if ! grep -q '"success":true' <<<"$RESP"; then
              echo "::error::Upload failed for $stable: $RESP"
              exit 1
            fi
            echo "::endgroup::"
          done

  publish-version:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Publish version after every platform bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.ref_name }}" > version.txt
          # Publish the marker only after both Linux and Windows binaries have
          # succeeded, so clients can never see a new version with an old EXE.
          RESP="$(curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
            -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
            -F "token=63cef07f4ee54823b25c652b0268f71d" \
            -F "version=latest" \
            -F "name=cangling-keeper-version" \
            -F "summary=${{ github.ref_name }}" \
            -F "os=app" \
            -F "arch=all" \
            -F "file=@version.txt")"
          echo "$RESP"
          if ! grep -q '"success":true' <<<"$RESP"; then
            echo "::error::Upload failed for version.txt: $RESP"
            exit 1
          fi
