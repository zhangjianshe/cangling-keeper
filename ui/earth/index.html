<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cangling Earth · Web</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06101d; }
      canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem;
        color: #c9d9ef; background: #06101d; font: 16px/1.5 system-ui, sans-serif;
        text-align: center; white-space: pre-wrap; }
      #runtime-error { position: fixed; z-index: 5; top: 16px; left: 16px; right: 16px;
        padding: 12px 16px; color: #ffe0dc; background: #54201d; font: 14px/1.5 system-ui, sans-serif;
        white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="status" role="status">Starting Cangling Earth…</div>
    <script type="module" src="./keeper-bridge.js"></script>
    <script type="module">
      const status = document.getElementById('status');
      window.addEventListener('keydown', event => {
        if (event.key === 'F1') event.preventDefault();
      }, { capture: true });
      let backend;
      const showError = message => {
        const element = document.getElementById('runtime-error') || document.createElement('div');
        element.id = 'runtime-error';
        element.textContent = message;
        document.body.append(element);
      };
      window.addEventListener('cangling-gpu-error', () => {
        const message = window.canglingLastGpuError || 'GPU render failed';
        if (backend === 'webgpu') {
          const fallback = new URL(document.baseURI);
          fallback.searchParams.set('backend', 'webgl2');
          showError(`WebGPU 绘制失败，正在切换 WebGL2…\n${message}`);
          location.replace(fallback);
        } else {
          showError(`图形绘制失败：${message}`);
        }
      }, { once: true });
      if (!window.isSecureContext) {
        status.textContent = 'Open this page from localhost or HTTPS so browser tile caching is available.';
      } else {
        try {
          const { startDataWorker } = await import('./data-worker-client.js');
          startDataWorker();
          const { default: init, start } = await import('./pkg/cangling_desktop.js');
          await init();
          const forced = new URL(document.baseURI).searchParams.get('backend');
          const adapter = forced === 'webgl2' ? null :
            navigator.gpu ? await navigator.gpu.requestAdapter() : null;
          backend = adapter ? 'webgpu' : 'webgl2';
          start(backend);
        } catch (error) {
          showError(`地球启动失败：${error}`);
          console.error(error);
        }
      }
    </script>
  </body>
</html>
