[package]
name = "cangling-keeper"
version = "0.0.126"
description = "A browser-based Rust service for host and repository maintenance"
authors = ["satway"]
edition = "2024"

[lib]
name = "cangling_keeper_lib"
crate-type = ["rlib"]

[dependencies]
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
base64 = "0.22"
signature = "3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time", "rt", "rt-multi-thread", "io-std", "signal", "process"] }
rand = "0.10"
tun = { version = "0.8.14", features = ["async"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
cap-std = "4"
similar = { version = "3", features = ["text"] }
yaml-rust2 = { version = "0.13", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
