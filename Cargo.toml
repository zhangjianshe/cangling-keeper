[package]
name = "cangling-keeper"
version = "0.0.88"
description = "A browser-based Rust service for host and repository maintenance"
authors = ["satway"]
edition = "2024"

[lib]
name = "cangling_keeper_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
base64 = "0.22"
signature = "3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time", "rt", "rt-multi-thread", "io-std", "signal"] }
rand = "0.10"
tun = { version = "0.8.14", features = ["async"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
